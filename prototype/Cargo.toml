[package]
name = "finance_probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen-cli"]

[features]
bindgen-cli = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
uniffi = { version = "=0.32.0", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[profile.dev]
panic = "unwind"
